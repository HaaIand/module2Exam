<!DOCTYPE html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
    <title>Housing Listings</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="container-fluid">
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5 apartmenttitle" id="exampleModalLabel">Search for housing</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="search" class="form control w-100" id="housesearch">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary primary" onclick="searchHousing()">Search</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Header which is used on all three pages-->
        <div class="header">
            <div id="leftsideheader">
                <a id="mainpagelink" href="main.html" target="_self"><img src="images/Collab Logo.png" alt="UiBSammenLogo"></a>
            </div>
            <div id="rightsideheader">
                <div id="whiteheader1">
                    
                </div>
                <div id="whiteheader2">
                    
                </div>
                <div id="whiteheader3">
                    
                </div>
                <div id="login">
                    <img class="icon" src="images/material-symbols_person.png" onclick="loginUIB()" alt="Login">
                </div>
                <div>
                    <img class="icon" id="search" data-bs-toggle="modal" data-bs-target="#exampleModal" src="images/search icon.png" alt="Search">
                </div>
                <div>
                    <img class="icon" id="hamburger" src="images/quill_hamburger.png" alt="Hamburger">
                </div>
                <div id="whitefooter1">
                    
                </div>
                <div id="whitefooter2">
                    
                </div>
                <div id="whitefooter3">
                    
                </div>
            </div>
        </div>
        <div class="body" id="mainbody">
            <div class="headinfo" id="availhead">
                <p class="headinfotext">Available Apartments</p>
                <div id="dropdowns">
                    <div class="dropdown">
                        <button class="btn btn-secondary secondary dropdown-toggle" type="button" id="dropdownMenuButton3" data-bs-toggle="dropdown" aria-expanded="false">
                            Sort Asc
                        </button>
                        <ul class="dropdown-menu">
                            <li><button class="dropdown-item" type="button" onclick="sortASC('pricePerMonth')">Price</button></li>
                            <li><button class="dropdown-item" type="button" onclick="sortASC('housingConditions.distanceToCityCentre')">Distance From Centre</button></li>
                            <li><button class="dropdown-item" type="button" onclick="sortASC('housingConditions.sizeSqm')">Size</button></li>
                            <li><button class="dropdown-item" type="button" onclick="sortASC('availableFrom')">Earliest Available</button></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-secondary secondary dropdown-toggle" type="button" id="dropdownMenuButton2" data-bs-toggle="dropdown" aria-expanded="false">
                            Sort DESC
                        </button>
                        <ul class="dropdown-menu">
                            <li><button class="dropdown-item" type="button" onclick="sortDESC('pricePerMonth')">Price</button></li>
                            <li><button class="dropdown-item" type="button" onclick="sortDESC('housingConditions.distanceToCityCentre')">Distance From Centre</button></li>
                            <li><button class="dropdown-item" type="button" onclick="sortDESC('housingConditions.sizeSqm')">Size</button></li>
                            <li><button class="dropdown-item" type="button" onclick="sortDESC('availableFrom')">Earliest Available</button></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-secondary secondary dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                            Filter menu
                        </button>
                        <div class="dropdown-menu">
                            <form class="px-4 py-3">
                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="dropdownCheck1">
                                    <label class="form-check-label" for="dropdownCheck1">
                                        Private Bathroom
                                    </label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="dropdownCheck2">
                                    <label class="form-check-label" for="dropdownCheck2">
                                        Private Kitchen
                                    </label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="dropdownCheck3">
                                    <label class="form-check-label" for="dropdownCheck3">
                                        Is Furnished
                                    </label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="form-range">
                                    <input type="range" min="1000" max="9999" step="100" value="5000" class="form-range-input" id="dropdownRange">
                                    <label class="form-range-label" for="dropdownRage" id="pricelabel">
                                    </label>
                                </div>
                            </div>
                            <br>
                            <div class="dropdown-divider"></div>
                            <button type="submit" class="btn btn-primary primary" id="filterapply">Apply filters</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex" id="availableapartments">
        </div>
        <div class="footer">
            <div id="leftsidefooter">
                <div class="footeritem" id="contactmethods">
                    <div>
                        <p>Contact Us</p>
                    </div>
                    <div id="socialmedia">
                        <div id="facebook">
                            <img src="images/ic_baseline-facebook.png" onclick="uibFacebook()" alt="Facebook Logo">
                        </div>
                        <div id="snapchat">
                            <img src="images/ic_baseline-snapchat.png" onclick="uibSnap()" alt="Snapchat Logo">
                        </div>
                        <div id="instagram">
                            <img src="images/mdi_instagram.png" onclick="uibInstagram()" alt="Instagram Logo">
                        </div>
                        <div id="youtube">
                            <img src="images/mdi_youtube.png" onclick="uibYoutube()" alt="Youtube Logo">
                        </div>
                    </div>
                </div>
                <div class="footeritem" id="studies">
                    <p>Studies</p>
                </div>
                <div class="footeritem" id="about">
                    <p>About Us</p>
                </div>
                <div class="footeritem" id="addmore">
                    <p>Add an Apartment</p>
                </div>
            </div>
            <div>
                <img src="images/Collab Logo.png" alt="UiBLogo">
            </div>
        </div>
    </div>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
