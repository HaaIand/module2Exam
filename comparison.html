                    <h5 class="modal-title" id="compareModalLabelleft">Select a new listing to compare</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <select class="form-select" id="newListingSelectleft">

                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary primary" id="confirmCompareBtnleft" onclick="applyNewCompare()">Compare</button>
                </div>
            </div>
